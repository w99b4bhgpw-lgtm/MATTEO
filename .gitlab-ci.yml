stages:
  - deploy

pages:
  stage: deploy
  image: alpine:3.20
  script:
    - mkdir -p public
    - cp index.html app.js config.js styles.css public/
    - 'sed -i "s/publicApis: false/publicApis: true/" public/config.js'
  pages:
    publish: public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
